# RPA Auto-Browser Configuration
browser:
  engine: "brave"           # "brave" or "chromium" (Brave has built-in ad/tracker blocking and anti-fingerprinting)
  brave_path: ""            # Leave empty to auto-detect installed Brave Browser
  headless: false           # Set to true for silent background running; false to watch the browser
  slow_mo_ms: 60            # Milliseconds delay between actions for human-like execution
  user_data_dir: "data/browser_profile" # Persistent browser session (stores cookies/logins)
  timeout_ms: 30000

