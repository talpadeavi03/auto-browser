<!DOCTYPE html>
<html>
<head><title>Job Application</title></head>
<body>
  <h1>Apply for DevOps Engineer</h1>
  <form id="app-form" onsubmit="event.preventDefault(); document.body.innerHTML = '<h1>Thank you for your application</h1>';">
    <div>
      <label for="name">Full Name *</label>
      <input id="name" name="name" required />
    </div>
    <div>
      <label for="email">Email *</label>
      <input id="email" name="email" type="email" required />
    </div>
    <div>
      <label for="phone">Phone *</label>
      <input id="phone" name="phone" type="tel" required />
    </div>
    <div>
      <label for="resume">Resume / CV *</label>
      <input id="resume" name="resume" type="file" required />
    </div>
    <div>
      <label>
        <input type="checkbox" name="agree" required />
        I agree to the privacy terms and policy
      </label>
    </div>
    <button type="submit" id="submit-btn">Submit Application</button>
  </form>
</body>
</html>
