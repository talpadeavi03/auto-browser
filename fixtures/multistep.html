<!DOCTYPE html>
<html>
<head><title>Multi-step Application</title></head>
<body>
  <h1>Candidate Application</h1>
  <form id="multi-form">
    <div id="step-1">
      <label for="name">Full Name *</label>
      <input id="name" name="name" required />
      <button type="button" id="next-btn" onclick="document.getElementById('step-1').style.display='none'; document.getElementById('step-2').style.display='block';">Next</button>
    </div>
    <div id="step-2" style="display:none;">
      <label for="email">Email *</label>
      <input id="email" name="email" type="email" required />
      <button type="button" id="submit-btn" onclick="document.body.innerHTML='<h2>Application successfully submitted</h2>';">Submit Application</button>
    </div>
  </form>
</body>
</html>
