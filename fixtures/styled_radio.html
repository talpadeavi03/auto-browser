<!DOCTYPE html>
<html>
<head><title>Radio Application</title></head>
<body>
  <h1>Apply for DevOps Position</h1>
  <form id="app-form" onsubmit="event.preventDefault(); document.body.innerHTML = '<h2>Application has been received</h2>';">
    <fieldset>
      <legend>Are you authorized to work in India?</legend>
      <label><input type="radio" name="auth" id="r_yes" value="Yes" required /> Yes</label>
      <label><input type="radio" name="auth" id="r_no" value="No" required /> No</label>
    </fieldset>
    <button type="submit">Submit</button>
  </form>
</body>
</html>
