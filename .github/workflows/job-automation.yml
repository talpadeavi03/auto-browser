name: 24/7 Cloud Job Automation & Profile Booster

on:
  push:
    branches: [ master, main ]
  schedule:
    # Runs every 4 hours automatically to keep Naukri profile marked 'Active Today'
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Choose task to run'
        required: true
        default: 'run-all'
        type: choice
        options:
          - 'run-all'
          - 'naukri-boost'
          - 'linkedin-apply'
          - 'naukri-apply'
          - 'scrape-jobs'
          - 'verify'

jobs:
  automation:
    name: Cloud RPA & Auto-Apply Worker
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Decode & Restore Authenticated Session
        env:
          AUTH_STORAGE_STATE: ${{ secrets.AUTH_STORAGE_STATE }}
        run: |
          mkdir -p data
          python -c "
          import os, sys, json, base64
          raw = os.getenv('AUTH_STORAGE_STATE', '').strip()
          if not raw:
              print('⚠️ AUTH_STORAGE_STATE secret is empty or unset. Continuing in unauthenticated mode.')
              sys.exit(0)

          # Case 1: User pasted raw JSON
          if raw.startswith('{') and 'cookies' in raw:
              try:
                  data = json.loads(raw)
                  with open('data/auth_state.json', 'w') as f:
                      json.dump(data, f, indent=2)
                  print(f'✓ Successfully restored {len(data.get(\"cookies\", []))} session cookies from raw JSON!')
                  sys.exit(0)
              except Exception as e:
                  print(f'Raw JSON parsing failed: {e}')

          # Case 2: Base64 encoded string (clean whitespace, newlines, tabs, and auto-fix padding)
          try:
              clean_b64 = ''.join(raw.split())
              missing_padding = len(clean_b64) % 4
              if missing_padding:
                  clean_b64 += '=' * (4 - missing_padding)
              decoded = base64.b64decode(clean_b64, validate=False).decode('utf-8')
              data = json.loads(decoded)
              with open('data/auth_state.json', 'w') as f:
                  json.dump(data, f, indent=2)
              print(f'✓ Successfully decoded and restored {len(data.get(\"cookies\", []))} session cookies from Base64!')
          except Exception as e:
              print(f'⚠️ Warning: Could not decode AUTH_STORAGE_STATE ({e}). Continuing without cached session.')
          "

      - name: Test MCP Server & CLI Engine
        env:
          PYTHONPATH: .
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AUTH_STORAGE_STATE: ${{ secrets.AUTH_STORAGE_STATE }}
          LINKEDIN_LI_AT: ${{ secrets.LINKEDIN_LI_AT }}
          LINKEDIN_USERNAME: ${{ secrets.LINKEDIN_USERNAME }}
          LINKEDIN_PASSWORD: ${{ secrets.LINKEDIN_PASSWORD }}
        run: |
          python -c "import mcp_server; print('✓ MCP Server verified successfully!')"
          python -c "
          import os
          print('--- Cloud Authentication Diagnostics ---')
          print('✓ AUTH_STORAGE_STATE secret set:', bool(os.getenv('AUTH_STORAGE_STATE', '').strip()))
          print('✓ LINKEDIN_LI_AT dedicated secret set:', bool(os.getenv('LINKEDIN_LI_AT', '').strip()))
          print('✓ LINKEDIN_USERNAME credential set:', bool(os.getenv('LINKEDIN_USERNAME', '').strip()))
          print('✓ LINKEDIN_PASSWORD credential set:', bool(os.getenv('LINKEDIN_PASSWORD', '').strip()))
          "
          python main.py --help
          python main.py stats

      - name: Execute Cloud Automation Sequence
        env:
          PYTHONPATH: .
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AUTH_STORAGE_STATE: ${{ secrets.AUTH_STORAGE_STATE }}
          LINKEDIN_LI_AT: ${{ secrets.LINKEDIN_LI_AT }}
          LINKEDIN_USERNAME: ${{ secrets.LINKEDIN_USERNAME }}
          LINKEDIN_PASSWORD: ${{ secrets.LINKEDIN_PASSWORD }}
          NAUKRI_USERNAME: ${{ secrets.NAUKRI_USERNAME }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
        run: |
          echo "Trigger event: ${{ github.event_name }}"
          ACTION="${{ inputs.action }}"

          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "⏰ Running Profile Booster & Auto-Apply sequence..."
            xvfb-run -a python main.py naukri-refresh || true
            xvfb-run -a python main.py linkedin-apply --limit 5 || true
            xvfb-run -a python main.py naukri-apply --limit 5 || true
          elif [ "$ACTION" = "run-all" ]; then
            echo "🚀 Running complete RPA sequence (Boost + LinkedIn + Naukri)..."
            xvfb-run -a python main.py run-all --limit 5 || true
          elif [ "$ACTION" = "naukri-boost" ]; then
            xvfb-run -a python main.py naukri-refresh
          elif [ "$ACTION" = "linkedin-apply" ]; then
            xvfb-run -a python main.py linkedin-apply --limit 10
          elif [ "$ACTION" = "naukri-apply" ]; then
            xvfb-run -a python main.py naukri-apply --limit 10
          elif [ "$ACTION" = "scrape-jobs" ]; then
            xvfb-run -a python main.py scrape --platform all
          fi

          python main.py export || true
          python main.py export-dataset || true
          python main.py stats || true

      - name: Auto-Sync Fresh ML Training Dataset to GitHub
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f data/training_dataset.jsonl ]; then
            git add data/training_dataset.jsonl
            if ! git diff --staged --quiet; then
              git commit -m "data: auto-sync continuous ML dataset [skip ci]"
              git push origin master
              echo "✓ Successfully committed and pushed fresh training dataset to GitHub for Google Colab!"
            else
              echo "No new interaction dataset changes to commit."
            fi
          fi

      - name: Upload Application Reports, Database & ML Dataset Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-rpa-reports-${{ github.run_id }}
          path: |
            data/exports/*.xlsx
            data/exports/*.csv
            data/exports/*.png
            data/jobs.db
            data/training_dataset.jsonl
          retention-days: 14
