name: 24/7 Cloud Job Automation & Profile Booster

on:
  push:
    branches: [ master, main ]
  schedule:
    # Runs every 4 hours automatically to keep Naukri profile marked 'Active Today'
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Choose task to run'
        required: true
        default: 'run-all'
        type: choice
        options:
          - 'run-all'
          - 'naukri-boost'
          - 'linkedin-apply'
          - 'naukri-apply'
          - 'scrape-jobs'
          - 'verify'

jobs:
  automation:
    name: Cloud RPA & Auto-Apply Worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Decode & Restore Authenticated Session
        env:
          AUTH_STORAGE_STATE: ${{ secrets.AUTH_STORAGE_STATE }}
        run: |
          mkdir -p data
          if [ -n "$AUTH_STORAGE_STATE" ]; then
            echo "$AUTH_STORAGE_STATE" | base64 -d > data/auth_state.json
            echo "✓ Restored session cookies from GitHub Secrets into data/auth_state.json"
          else
            echo "⚠️ AUTH_STORAGE_STATE secret not set. Running in unauthenticated mode."
          fi

      - name: Test MCP Server & CLI Engine
        env:
          PYTHONPATH: .
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c "import mcp_server; print('✓ MCP Server verified successfully!')"
          python main.py --help
          python main.py stats

      - name: Execute Cloud Automation Sequence
        env:
          PYTHONPATH: .
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AUTH_STORAGE_STATE: ${{ secrets.AUTH_STORAGE_STATE }}
        run: |
          echo "Trigger event: ${{ github.event_name }}"
          ACTION="${{ inputs.action }}"

          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "⏰ Running scheduled Profile Booster & Auto-Apply sequence..."
            xvfb-run -a python main.py naukri-refresh || true
            xvfb-run -a python main.py linkedin-apply --limit 5 || true
            xvfb-run -a python main.py naukri-apply --limit 5 || true
          elif [ "$ACTION" = "run-all" ]; then
            echo "🚀 Running complete RPA sequence (Boost + LinkedIn + Naukri)..."
            xvfb-run -a python main.py run-all --limit 5 || true
          elif [ "$ACTION" = "naukri-boost" ]; then
            xvfb-run -a python main.py naukri-refresh
          elif [ "$ACTION" = "linkedin-apply" ]; then
            xvfb-run -a python main.py linkedin-apply --limit 10
          elif [ "$ACTION" = "naukri-apply" ]; then
            xvfb-run -a python main.py naukri-apply --limit 10
          elif [ "$ACTION" = "scrape-jobs" ]; then
            xvfb-run -a python main.py scrape --platform all
          fi

          python main.py export || true
          python main.py stats || true

      - name: Upload Application Reports & Database Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-rpa-reports-${{ github.run_id }}
          path: |
            data/exports/*.xlsx
            data/exports/*.csv
            data/jobs.db
          retention-days: 14
