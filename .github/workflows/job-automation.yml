name: 24/7 Cloud Job Automation & Profile Booster

on:
  push:
    branches: [ master, main, 2.0 ]
  schedule:
    # Runs every 2 hours automatically across all platforms
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Choose task to run'
        required: true
        default: 'run-all'
        type: choice
        options:
          - 'run-all'
          - 'naukri-boost'
          - 'linkedin-boost'
          - 'linkedin-apply'
          - 'naukri-apply'
          - 'indeed-apply'
          - 'glassdoor-apply'
          - 'foundit-apply'
          - 'ambitionbox-apply'
          - 'jobot-apply'
          - 'gmail-apply'
          - 'scrape-jobs'
          - 'verify'

concurrency:
  group: cloud-job-automation
  cancel-in-progress: false

jobs:
  automation:
    name: Cloud RPA & Auto-Apply Worker
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Decode & Restore Authenticated Session
        env:
          AUTH_STORAGE_STATE: ${{ secrets.AUTH_STORAGE_STATE }}
        run: |
          mkdir -p data
          python -c "
          import os, sys, json, base64
          raw = os.getenv('AUTH_STORAGE_STATE', '').strip()
          if not raw:
              print('⚠️ AUTH_STORAGE_STATE secret is empty or unset. Continuing in unauthenticated mode.')
              sys.exit(0)

          # Case 1: User pasted raw JSON
          if raw.startswith('{') and 'cookies' in raw:
              try:
                  data = json.loads(raw)
                  with open('data/auth_state.json', 'w') as f:
                      json.dump(data, f, indent=2)
                  print(f'✓ Successfully restored {len(data.get(\"cookies\", []))} session cookies from raw JSON!')
                  sys.exit(0)
              except Exception as e:
                  print(f'Raw JSON parsing failed: {e}')

          # Case 2: Base64 encoded string (clean whitespace, newlines, tabs, and auto-fix padding)
          try:
              clean_b64 = ''.join(raw.split())
              missing_padding = len(clean_b64) % 4
              if missing_padding:
                  clean_b64 += '=' * (4 - missing_padding)
              decoded = base64.b64decode(clean_b64, validate=False).decode('utf-8')
              data = json.loads(decoded)
              with open('data/auth_state.json', 'w') as f:
                  json.dump(data, f, indent=2)
              print(f'✓ Successfully decoded and restored {len(data.get(\"cookies\", []))} session cookies from Base64!')
          except Exception as e:
              print(f'⚠️ Warning: Could not decode AUTH_STORAGE_STATE ({e}). Continuing without cached session.')
          "

      - name: Restore Candidate Profile & Resume Secrets
        env:
          PROFILE_YAML_B64: ${{ secrets.PROFILE_YAML_B64 }}
          RESUME_PDF_B64: ${{ secrets.RESUME_PDF_B64 }}
        run: |
          mkdir -p data/resumes
          if [ -n "$PROFILE_YAML_B64" ]; then
            echo "$PROFILE_YAML_B64" | base64 -d > profile.yaml
            echo "✓ Successfully restored profile.yaml from secret!"
          elif [ -f data/profile_secret_for_github.txt ]; then
            cat data/profile_secret_for_github.txt | base64 -d > profile.yaml
            echo "✓ Restored profile.yaml from fallback template!"
          fi
          if [ -n "$RESUME_PDF_B64" ]; then
            echo "$RESUME_PDF_B64" | base64 -d > data/resumes/resume.pdf
            echo "$RESUME_PDF_B64" | base64 -d > data/resumes/AT_26_AI.pdf
            echo "$RESUME_PDF_B64" | base64 -d > resume.pdf
            echo "✓ Successfully restored resume.pdf from secret!"
          elif [ -f data/resume_secret_for_github.txt ]; then
            cat data/resume_secret_for_github.txt | base64 -d > data/resumes/resume.pdf
            cat data/resume_secret_for_github.txt | base64 -d > data/resumes/AT_26_AI.pdf
            cat data/resume_secret_for_github.txt | base64 -d > resume.pdf
            echo "✓ Restored resume.pdf from fallback template!"
          fi

      - name: Test MCP Server & CLI Engine
        env:
          PYTHONPATH: .
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_MODEL_ID: ${{ secrets.HF_MODEL_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          AUTH_STORAGE_STATE: ${{ secrets.AUTH_STORAGE_STATE }}
          LINKEDIN_LI_AT: ${{ secrets.LINKEDIN_LI_AT }}
          LINKEDIN_USERNAME: ${{ secrets.LINKEDIN_USERNAME }}
          LINKEDIN_PASSWORD: ${{ secrets.LINKEDIN_PASSWORD }}
        run: |
          python -c "import mcp_server; print('✓ MCP Server verified successfully!')"
          python test_forms.py || true
          python eval_answers.py || true
          python -c "
          import os
          print('--- Cloud Authentication Diagnostics ---')
          print('✓ AUTH_STORAGE_STATE secret set:', bool(os.getenv('AUTH_STORAGE_STATE', '').strip()))
          print('✓ PROFILE_YAML_B64 secret set:', bool(os.getenv('PROFILE_YAML_B64', '').strip()))
          print('✓ RESUME_PDF_B64 secret set:', bool(os.getenv('RESUME_PDF_B64', '').strip()))
          print('✓ DEEPSEEK_API_KEY secret set:', bool(os.getenv('DEEPSEEK_API_KEY', '').strip()))
          print('✓ HF_MODEL_ID secret set:', bool(os.getenv('HF_MODEL_ID', '').strip()))
          print('✓ HF_TOKEN secret set:', bool(os.getenv('HF_TOKEN', '').strip()))
          print('✓ GEMINI_API_KEY secret set:', bool(os.getenv('GEMINI_API_KEY', '').strip()))
          print('✓ LINKEDIN_LI_AT dedicated secret set:', bool(os.getenv('LINKEDIN_LI_AT', '').strip()))
          print('✓ LINKEDIN_USERNAME credential set:', bool(os.getenv('LINKEDIN_USERNAME', '').strip()))
          print('✓ LINKEDIN_PASSWORD credential set:', bool(os.getenv('LINKEDIN_PASSWORD', '').strip()))
          "
          python main.py --help
          python main.py stats

      - name: Execute Cloud Automation Sequence
        env:
          PYTHONPATH: .
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_MODEL_ID: ${{ secrets.HF_MODEL_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          AUTH_STORAGE_STATE: ${{ secrets.AUTH_STORAGE_STATE }}
          LINKEDIN_LI_AT: ${{ secrets.LINKEDIN_LI_AT }}
          LINKEDIN_USERNAME: ${{ secrets.LINKEDIN_USERNAME }}
          LINKEDIN_PASSWORD: ${{ secrets.LINKEDIN_PASSWORD }}
          NAUKRI_USERNAME: ${{ secrets.NAUKRI_USERNAME || secrets.NAUKRI_USERNAM }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          GMAIL_USER: ${{ secrets.GMAIL_USER || 'talpadeavi0303@gmail.com' }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "Trigger event: ${{ github.event_name }}"
          ACTION="${{ inputs.action }}"

          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "⏰ Running Profile Booster & Multi-Platform Auto-Apply sequence..."
            xvfb-run -a python main.py naukri-refresh || true
            xvfb-run -a python main.py linkedin-refresh || true
            xvfb-run -a python main.py linkedin-apply --limit 5 || true
            xvfb-run -a python main.py naukri-apply --limit 5 || true
            xvfb-run -a python main.py indeed-apply --limit 5 || true
            xvfb-run -a python main.py glassdoor-apply --limit 5 || true
            xvfb-run -a python main.py foundit-apply --limit 5 || true
            xvfb-run -a python main.py ambitionbox-apply --limit 5 || true
            xvfb-run -a python main.py jobot-apply --limit 5 || true
            xvfb-run -a python main.py gmail-apply --limit 5 || true
          elif [ "$ACTION" = "run-all" ]; then
            echo "🚀 Running complete Multi-Platform RPA sequence (Naukri, LinkedIn, Indeed, Glassdoor, Foundit, AmbitionBox, Jobot, Gmail Alerts)..."
            xvfb-run -a python main.py run-all --limit 5 || true
          elif [ "$ACTION" = "naukri-boost" ]; then
            xvfb-run -a python main.py naukri-refresh
          elif [ "$ACTION" = "linkedin-boost" ]; then
            xvfb-run -a python main.py linkedin-refresh
          elif [ "$ACTION" = "linkedin-apply" ]; then
            xvfb-run -a python main.py linkedin-apply --limit 10
          elif [ "$ACTION" = "naukri-apply" ]; then
            xvfb-run -a python main.py naukri-apply --limit 10
          elif [ "$ACTION" = "indeed-apply" ]; then
            xvfb-run -a python main.py indeed-apply --limit 10
          elif [ "$ACTION" = "glassdoor-apply" ]; then
            xvfb-run -a python main.py glassdoor-apply --limit 10
          elif [ "$ACTION" = "foundit-apply" ]; then
            xvfb-run -a python main.py foundit-apply --limit 10
          elif [ "$ACTION" = "ambitionbox-apply" ]; then
            xvfb-run -a python main.py ambitionbox-apply --limit 10
          elif [ "$ACTION" = "jobot-apply" ]; then
            xvfb-run -a python main.py jobot-apply --limit 10
          elif [ "$ACTION" = "gmail-apply" ]; then
            xvfb-run -a python main.py gmail-apply --limit 10
          elif [ "$ACTION" = "scrape-jobs" ]; then
            xvfb-run -a python main.py scrape --platform all
          elif [ "$ACTION" = "verify" ]; then
            python main.py verify
          fi

          python main.py export || true
          python main.py export-dataset || true
          python main.py stats || true

      - name: Auto-Sync Fresh ML Training Dataset to GitHub
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          python main.py export-dataset || true
          if [ -f data/training_dataset.jsonl ]; then
            git add data/training_dataset.jsonl
            if ! git diff --staged --quiet; then
              git commit -m "data: auto-sync continuous ML dataset [skip ci]"
              git pull --rebase origin HEAD || true
              git push origin HEAD
              echo "✓ Successfully committed and pushed fresh training dataset to GitHub for Google Colab!"
            else
              echo "No new interaction dataset changes to commit."
            fi
          fi

      - name: Upload Application Reports, Database & ML Dataset Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-rpa-reports-${{ github.run_id }}
          path: |
            data/exports/*.xlsx
            data/exports/*.csv
            data/exports/*.png
            data/exports/*.html
            data/jobs.db
            data/training_dataset.jsonl
          retention-days: 14
